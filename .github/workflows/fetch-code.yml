
name: Fetch Fenix source

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch-fenix-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Clone code
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse --no-checkout https://github.com/mozilla-firefox/firefox.git /tmp/gh-firefox
          git -C /tmp/gh-firefox sparse-checkout set --no-cone mobile/android/fenix
          git -C /tmp/gh-firefox checkout

      - name: List files
        shell: bash
        run: |
          set -euo pipefail
          pwd
          ls -alhtR /tmp/gh-firefox



