
name: Fetch latest Fenix source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-latest-fenix-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Clone code
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse --no-checkout https://github.com/mozilla-firefox/firefox.git /tmp/firefox
          git -C /tmp/firefox sparse-checkout set --no-cone mobile/android/fenix
          git -C /tmp/firefox checkout

      - name: Delete code
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf -- {} +

      - name: Move files
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/firefox/mobile/android/fenix/* .
          git add -A

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update source from F-Droid archive"
            git push
          fi

