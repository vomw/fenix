
name: Fetch latest Fenix source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-fenix-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Clone code
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse --no-checkout https://github.com/mozilla-firefox/firefox.git /tmp/firefox
          git -C /tmp/firefox sparse-checkout set --no-cone mobile/android/fenix
          git -C /tmp/firefox checkout

      - name: Delete code
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf -- {} +
          ls -laht

      - name: Move files
        shell: bash
        run: |
          set -euo pipefail
          mv firefox/mobile/android/fenix/* .

      - name: List files
        shell: bash
        run: |
          set -euo pipefail
          pwd
          ls -alhtR /tmp/firefox
          git status



